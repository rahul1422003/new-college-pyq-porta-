<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | LNCT PYQ Portal</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            color: white;
        }
        .card {
            width: min(520px, calc(100% - 32px));
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 14px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }
        h1 { margin-top: 0; }
        p { color: #dbeafe; line-height: 1.6; }
        a {
            display: inline-block;
            margin-top: 16px;
            padding: 11px 16px;
            border-radius: 8px;
            text-decoration: none;
            background: white;
            color: #1d4ed8;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Something went wrong</h1>
    <p th:text="${message ?: 'Please go back and try again.'}">Please go back and try again.</p>
    <a th:href="@{/login}">Go to Login</a>
</div>
</body>
</html>
