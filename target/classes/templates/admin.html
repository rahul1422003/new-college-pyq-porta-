<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | LNCT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="admin-page">
    <section class="left-panel">
        <img th:src="@{/images/lnct.png}" alt="LNCT Logo" class="college-logo">
        <h1>LNCTU Admin Panel</h1>
        <p>Manage uploaded PYQs, placement quiz questions, student login records, feedback and result analytics from one place.</p>

        <div class="feature-list">
            <span>Upload PYQ</span>
            <span>Manage Users</span>
            <span>Quiz Manager</span>
            <span>Result Reports</span>
        </div>
    </section>

    <section class="login-card">
        <div class="card-header">
            <img th:src="@{/images/lnct.png}" alt="Logo">
            <div>
                <h2>Admin Login</h2>
                <p>Sign in to continue</p>
            </div>
        </div>

        <p th:if="${error}" th:text="${error}" class="error"></p>
        <p th:if="${success}" th:text="${success}" class="success"></p>

        <form th:action="@{/admin/login}" method="post">
            <label>Admin Email</label>
            <input type="text" name="email" placeholder="Enter Admin Email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter Password" required>

            <button type="submit">Login to Dashboard</button>
        </form>
    </section>
</div>

</body>
</html>
