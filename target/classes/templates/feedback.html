<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Feedback</title>

    <link rel="stylesheet" th:href="@{/css/feedback.css}">
</head>

<body>

<div class="logo-top">
    <img th:src="@{/images/lnct.png}">
</div>

<div class="feedback-box">

    <img th:src="@{/images/lnct.png}" class="logo-inside">

    <h2>📝 Student Feedback</h2>

    <div class="user-info">
        <strong th:text="${name}"></strong><br>
        <span th:text="${enrollment}"></span>
    </div>

    <div class="subject-info">
        Subject: <span th:text="${subject}"></span>
    </div>

    <!-- ✅ FORM -->
    <form th:action="@{/feedback}" method="post">

        <input type="hidden" name="subject" th:value="${subject}">

        <div class="stars">
            <input type="radio" id="s5" name="rating" value="5"><label for="s5">★</label>
            <input type="radio" id="s4" name="rating" value="4"><label for="s4">★</label>
            <input type="radio" id="s3" name="rating" value="3"><label for="s3">★</label>
            <input type="radio" id="s2" name="rating" value="2"><label for="s2">★</label>
            <input type="radio" id="s1" name="rating" value="1"><label for="s1">★</label>
        </div>

        <textarea name="comment" placeholder="Write feedback..."></textarea>

        <button type="submit" class="btn">Submit</button> ✅

    </form>

</div>

</body>
</html>
