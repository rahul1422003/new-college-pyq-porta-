<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome | LNCT PYQ Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/sem.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>

<body>

<div class="header">
    <div class="top-bar">
        <input type="text" id="searchBar" placeholder="Search Semester">
        <img th:src="@{/images/lnct.png}" alt="LNCT Logo" class="logo">
    </div>

    <h1>B.Tech-AIML</h1>
    <h2>LNCT University, Bhopal</h2>

    <!-- ✅ Dynamic Data -->
    <p>
        Welcome <span th:text="${name}"></span> |
        Enrollment No: <span th:text="${enrollment}"></span>
    </p>

    <p>Select your semester to view Previous Year Question Papers</p>
    <p id="datetime"></p>
</div>

<div class="semester">

    <div class="semester-box">
        <a th:href="@{/Aimlsem1}">Semester 1</a>
    </div>

    <div class="semester-box">
        <a th:href="@{/Aimlsem2}">Semester 2</a>
    </div>

    <div class="semester-box">
        <a th:href="@{/Aimlsem3}">Semester 3</a>
    </div>

    <div class="semester-box">
        <a th:href="@{/Aimlsem4}">Semester 4</a>
    </div>

    <div class="semester-box">
        <a th:href="@{/Aimlsem5}">Semester 5</a>
    </div>

    <div class="semester-box">
        <a th:href="@{/Aimlsem6}">Semester 6</a>
    </div>

    <div class="semester-box">
        <a th:href="@{/Aimlsem7}">Semester 7</a>
    </div>

    <div class="semester-box">
        <a th:href="@{/Aimlsem8}">Semester 8</a>
    </div>

</div>

<script>
    document.getElementById("datetime").innerHTML = new Date().toLocaleString();

    document.getElementById("searchBar").addEventListener("keyup", function() {
      let input = this.value.toLowerCase();
      let boxes = document.getElementsByClassName("semester-box");

      for (let i = 0; i < boxes.length; i++) {
        let text = boxes[i].textContent.toLowerCase();
        boxes[i].style.display = text.includes(input) ? "" : "none";
      }
    });
</script>

</body>
</html>
