<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Course | LNCT PYQ Portal</title>
    <link rel="stylesheet" th:href="@{/css/course.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header class="header">
    <div class="top-bar">
        <img th:src="@{/images/lnct.png}" class="logo" alt="LNCT Logo">
        <div class="top-actions">
            <input type="text" id="searchBar" placeholder="Search Course">
            <a th:href="@{/dashboard}" class="action-link">Dashboard</a>
            <a th:href="@{/profile}" class="action-link action-link-alt">Profile</a>
        </div>
    </div>

    <div class="header-content">
        <h1>Hi, <span th:text="${name}"></span></h1>
        <p>Enrollment No: <span th:text="${enrollment}"></span></p>

        <p th:if="${semester != null}">
            Semester: <span th:text="${semester}"></span>
        </p>

        <h2>LNCT University, Bhopal</h2>
        <p>Select your current course</p>
        <p id="datetime"></p>
    </div>
</header>

<section class="summary-strip">
    <div class="summary-card">
        <span>Profile Completion</span>
        <strong th:text="${profileCompletion + '%'}">0%</strong>
    </div>
    <div class="summary-card">
        <span>Quiz Attempts</span>
        <strong th:text="${attemptCount}">0</strong>
    </div>
    <div class="summary-card">
        <span>Best Score</span>
        <strong th:text="${bestScore + '%'}">0%</strong>
    </div>
    <div class="summary-card">
        <span>Quick Access</span>
        <a th:href="@{/placement}">Placement Lab</a>
    </div>
</section>

<div class="semester">
    <div class="semester-box highlight">
        <span class="badge">Top</span>
        <a th:href="@{/placement}">
            Placement Preparation
        </a>
    </div>

    <div class="semester-box">
        <a th:href="@{/sem}">B.Tech-CSE</a>
    </div>
    <div class="semester-box">
        <a th:href="@{/Aimlsem}">B.Tech-AIML</a>
    </div>
    <div class="semester-box">
        <a th:href="@{/Mtech}">M.Tech</a>
    </div>
    <div class="semester-box">
        <a th:href="@{/BCA}">BCA</a>
    </div>
    <div class="semester-box">
        <a th:href="@{/MCA}">MCA</a>
    </div>
    <div class="semester-box">
        <a th:href="@{/BBA}">BBA</a>
    </div>
    <div class="semester-box">
        <a th:href="@{/MBA}">MBA</a>
    </div>
</div>

<script>
    document.getElementById("datetime").innerHTML =
      new Date().toLocaleString();

    document.getElementById("searchBar").addEventListener("keyup", function() {
      let input = this.value.toLowerCase();
      let boxes = document.getElementsByClassName("semester-box");

      for (let i = 0; i < boxes.length; i++) {
        let text = boxes[i].textContent.toLowerCase();
        boxes[i].style.display = text.includes(input) ? "" : "none";
      }
    });
</script>

</body>
</html>
