<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/admin-upload.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <title>Upload PYQ</title>
</head>
<body>

<h2>Upload PYQ PDF</h2>

<p th:if="${error}" th:text="${error}" class="message error"></p>
<p th:if="${success}" th:text="${success}" class="message success"></p>

<form action="/admin/upload" method="post" enctype="multipart/form-data">

    <label>Subject:</label>
    <input type="text" name="subject" required>

    <label>Choose PDF:</label>
    <input type="file" name="file" accept="application/pdf" required>

    <button type="submit">Upload</button>

</form>

<a href="/admin/dashboard">Back</a>

</body>
</html>
