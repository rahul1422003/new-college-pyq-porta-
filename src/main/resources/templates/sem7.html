<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Semester 7 | LNCT PYQ Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/sem7.css}">
</head>

<body>

<div class="header">
    <img th:src="@{/images/lnct.png}" alt="LNCT Logo" class="logo">

    <input type="text" id="searchBar" placeholder="Search Subject">

    <div class="title">
        <h1><u>Semester 7</u></h1>
        <h2>LNCT University, Bhopal</h2>

        <!-- ✅ Dynamic Data -->
        <p>
            Welcome <span th:text="${name}"></span> |
            Enrollment No: <span th:text="${enrollment}"></span>
        </p>

        <p id="datetime"></p>
    </div>
</div>

<div class="subject">

    <!-- NPTEL -->
    <div class="box-container">
        <h3>NPTEL</h3>
        <ul>
            <li>
                <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vQxHuRpCPTN16ho3JJzQQED9JyO06qKTDdipAI8ui2MCSRY3FtQCuqFBozkYoV8vjNOZbhUjA259-SN/pubhtml" target="_blank">
                    📘 NPTEL Course
                </a>
            </li>
        </ul>
    </div>

    <!-- Internship -->
    <div class="box-container">
        <h3>Evaluation of Internship</h3>
    </div>

    <!-- Major Project -->
    <div class="box-container">
        <h3>Major Project Planning and Development</h3>
    </div>

</div>

<script>
    document.getElementById("datetime").innerHTML = new Date().toLocaleString();

    document.getElementById("searchBar").addEventListener("keyup", function() {
      let input = this.value.toLowerCase();
      let boxes = document.getElementsByClassName("box-container");

      for (let i = 0; i < boxes.length; i++) {
        let text = boxes[i].textContent.toLowerCase();
        boxes[i].style.display = text.includes(input) ? "" : "none";
      }
    });
</script>

</body>
</html>
