<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Login History</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>

<div class="dashboard-shell">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark">LP</span>
            <div>
                <h2>LNCT Portal</h2>
                <p>Login Tracker</p>
            </div>
        </div>
        <nav>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/upload">Upload PYQ</a>
            <a href="/admin/manage-users">Manage Users</a>
            <a href="/admin/user-logins" class="active">User Logins</a>
            <a href="/admin/placement-quiz">Placement Quiz</a>
            <a href="/admin/placement-results">Quiz Results</a>
            <a href="/admin/feedback">Feedback</a>
            <a href="/admin/logout" class="logout-link">Logout</a>
        </nav>
    </aside>

    <main class="content">
        <section class="topbar">
            <div>
                <p class="eyebrow">Student Activity</p>
                <h1>User Login History</h1>
            </div>
            <a href="/admin/dashboard" class="secondary-action">Back Dashboard</a>
        </section>

        <section class="panel">
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Enrollment</th>
                        <th>Semester</th>
                        <th>Login Time</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="login : ${logins}">
                        <td th:text="${login.name}">Student</td>
                        <td th:text="${login.enrollment}">Enrollment</td>
                        <td><span class="pill" th:text="${login.semester}">Semester</span></td>
                        <td th:text="${#temporals.format(login.loginTime, 'dd MMM yyyy, hh:mm a')}">Date</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="empty-state" th:if="${logins.isEmpty()}">No user login record found.</div>
        </section>
    </main>
</div>

</body>
</html>
